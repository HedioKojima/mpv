name: build-mingw64
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mingw64:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-w64-mingw32
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      DOWNLOAD_CACHE: ${{ github.workspace }}/.ccache/downloads
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get cache timestamp
        id: get_time
        run: |
          echo "timestamp=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.TARGET }}-${{ steps.get_time.outputs.timestamp }}
          restore-keys: |
            ${{ env.TARGET }}-

      - name: Install build dependencies
        run: |
          # Native Windows tools via choco
          choco install --no-progress -y nasm ccache 7zip make
          # meson + ninja via pip (Python is preinstalled on windows-latest)
          python -m pip install --upgrade pip
          python -m pip install meson ninja
          # pkg-config-lite (standalone Windows build)
          PKGCFG_ZIP="pkg-config-lite-0.28-1_bin-win32.zip"
          curl -fL --retry 3 \
            "https://downloads.sourceforge.net/project/pkgconfiglite/0.28-1/${PKGCFG_ZIP}?download" \
            -o "$PKGCFG_ZIP"
          mkdir -p /c/tools/pkg-config
          7z x "$PKGCFG_ZIP" -o/c/tools/pkg-config -y > /dev/null
          echo "C:\\tools\\pkg-config\\bin" >> "$GITHUB_PATH"

      - name: Install gcc-mcf toolchain
        run: |
          # Dynamically fetch the latest x64-ucrt archive name (files are rotated)
          GCC_MCF_FILE=$(curl -s https://gcc-mcf.lhmouse.com/ | \
            grep -oP 'mingw-w64-gcc-mcf_[0-9]+_[0-9.]+_x64-ucrt_[a-f0-9]+\.7z' | \
            sort -r | head -n 1)
          if [ -z "$GCC_MCF_FILE" ]; then
            echo "Error: could not find latest gcc-mcf x64-ucrt archive" >&2
            exit 1
          fi
          GCC_MCF_URL="https://gcc-mcf.lhmouse.com/$GCC_MCF_FILE"
          echo "Downloading: $GCC_MCF_URL"
          curl -fL --retry 3 "$GCC_MCF_URL" -o "$GCC_MCF_FILE"
          echo "Extracting..."
          mkdir -p /c/gcc-mcf
          7z x "$GCC_MCF_FILE" -o/c/gcc-mcf -y > /dev/null
          # Locate the bin/ dir that holds the cross-compiler executables
          GCC_MCF_BIN=$(find /c/gcc-mcf -name "${TARGET}-gcc.exe" -printf '%h' | head -n 1)
          if [ -z "$GCC_MCF_BIN" ]; then
            echo "Error: could not find ${TARGET}-gcc.exe after extraction" >&2
            exit 1
          fi
          GCC_MCF_BIN_WIN=$(cygpath -w "$GCC_MCF_BIN")
          echo "$GCC_MCF_BIN_WIN" >> "$GITHUB_PATH"
          echo "gcc-mcf installed at: $GCC_MCF_BIN"
          "$GCC_MCF_BIN/${TARGET}-gcc.exe" --version

      - name: Verify toolchain
        run: |
          set -eux
          command -v "${TARGET}-gcc"
          command -v "${TARGET}-g++"
          command -v "${TARGET}-windres"
          command -v "${TARGET}-ar"
          command -v "${TARGET}-nm"
          command -v "${TARGET}-ranlib"
          command -v "${TARGET}-strip"
          command -v "${TARGET}-dlltool"
          "${TARGET}-gcc" --version
          "${TARGET}-g++" --version
          "${TARGET}-windres" --version || true

      - name: Build libraries
        run: |
          ./ci/build-mingw64.sh

      - name: Build mpv
        id: build
        run: |
          ./ci/build-mingw64.sh meson pack

      - name: Print meson log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          cat ./mingw_build/meson-logs/meson-log.txt

      - name: Functional test
        run: |
          cd artifact
          ./mpv.com -v --no-config

      - name: Get artifact name
        id: artifact
        run: |
          VERSION_FILE=$(find . -path "*/common/version.h" -type f | head -n 1)
          VER=$(grep VERSION "$VERSION_FILE" | cut -d'"' -f2)
          echo "name=mpv-$VER-${{ github.run_id }}-$TARGET" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifact/*

      - name: Save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.TARGET }}-${{ steps.get_time.outputs.timestamp }}
