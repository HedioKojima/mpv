name: build

# 推送到 master/main 或手动触发时，用官方 master 源码编译 win64 版 mpv
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  mpv-win64:
    # nanake/ffmpeg-tinderbox 的 win64-nonfree 镜像：
    # 自带 mingw-w64(UCRT) 交叉工具链、/cross.meson、全套静态依赖（含 fdk-aac /
    # xHE-AAC / MPEG-H / LCEVC 等 non-free 组件）、meson。
    # 注意：该镜像没有 wine，所以不做 wine 冒烟测试，改为检查 exe 的导入表。
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nanake/win64-nonfree:latest
    steps:
      # 本仓库只放了 CI 文件、没有 mpv 源码，所以先拉上游 master。
      # fetch-depth: 0 + fetch-tags 让 git describe 能算出 v0.x.y-n-gxxxx 完整版本号
      # （mpv 的版本号靠 git describe --tags --match v0.* 生成，浅克隆会退化成 dev 版本）
      - name: Checkout mpv source (upstream master)
        uses: actions/checkout@v7
        with:
          repository: mpv-player/mpv
          ref: master
          fetch-depth: 0
          fetch-tags: true
          path: mpv

      # 再检出本仓库（只有 CI 脚本），覆盖上游同名脚本，让本仓库的修改生效
      - name: Checkout CI scripts (this repo)
        uses: actions/checkout@v7
        with:
          path: ci-repo

      - name: Overlay CI scripts
        run: |
          cp -f ci-repo/ci/build-mingw64-full.sh mpv/ci/
          cp -f ci-repo/ci/build-common.sh mpv/ci/
          chmod +x mpv/ci/build-mingw64-full.sh mpv/ci/build-common.sh

      - name: Build
        id: build
        working-directory: mpv
        run: |
          ./ci/build-mingw64-full.sh

      - name: Print meson log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          cat ./mpv/build/meson-logs/meson-log.txt

      # 静态链接自检：镜像里的 import library（*.dll.a）已被删除，exe 只应依赖
      # Windows 系统 DLL。若出现 libgcc/libstdc++/libwinpthread 说明有东西退化成
      # 动态链接，运行时会在用户机器上缺 DLL，直接失败。
      - name: Check DLL imports
        working-directory: mpv/artifact
        run: |
          OBJDUMP="${FFBUILD_CROSS_PREFIX}objdump"
          command -v "$OBJDUMP" >/dev/null 2>&1 || OBJDUMP=objdump
          DLLS="${RUNNER_TEMP:-/tmp}/dlls.txt"
          "$OBJDUMP" -p mpv.exe | sed -n 's/^[[:space:]]*DLL Name: //p' | tee "$DLLS"
          if grep -Eqi '^(libgcc|libstdc\+\+|libwinpthread|libssp)' "$DLLS"; then
            echo "::error::mpv.exe imports a non-system DLL, the build is not self-contained"
            exit 1
          fi

      - name: Artifact name
        id: artifact
        run: |
          VERSION_FILE=$(find ./mpv -path "*/common/version.h" -type f | head -n 1)
          VER=$(grep VERSION "$VERSION_FILE" | cut -d'"' -f2)
          echo "name=mpv-$VER-${{ github.run_id }}-win64-full" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: mpv/artifact/*
