name: build-mingw64
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mingw64:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-w64-mingw32
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      DOWNLOAD_CACHE: ${{ github.workspace }}/.ccache/downloads
      # Git Bash: create real symlinks (Developer Mode is enabled on the
      # runner), fail loudly instead of silently copying — the prefix_dir
      # usr/local symlink trick relies on symlink semantics.
      MSYS: winsymlinks:nativestrict
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get cache timestamp
        id: get_time
        run: |
          echo "timestamp=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.TARGET }}-${{ steps.get_time.outputs.timestamp }}
          restore-keys: |
            ${{ env.TARGET }}-

      - name: Install minimal extra tools
        run: |
          # gcc-mcf ships with cmake/meson/ninja/pkgconf/make/wget/curl/python/yasm;
          # only nasm and ccache are missing, plus 7zip for extracting the .7z.
          choco install --no-progress -y nasm ccache 7zip
          # choco may not refresh PATH for the current shell; add 7-Zip explicitly.
          echo "C:\\Program Files\\7-Zip" >> "$GITHUB_PATH"

      - name: Install gcc-mcf toolchain
        run: |
          set -x
          # Ensure 7-Zip is findable in this step too
          export PATH="/c/Program Files/7-Zip:$PATH"
          command -v 7z || { echo "7z not found"; exit 1; }

          # Fetch directory listing and extract latest x64-ucrt archive name.
          # Use -E (extended regex) instead of -P; Git Bash grep may lack PCRE.
          # Retry: gcc-mcf.lhmouse.com has intermittent DNS/availability issues.
          LISTING=""
          for attempt in 1 2 3 4 5; do
            LISTING=$(curl -fsSL --retry 3 --retry-delay 5 https://gcc-mcf.lhmouse.com/) && break
            echo "Attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          if [ -z "$LISTING" ]; then
            echo "Error: could not fetch directory listing" >&2
            exit 1
          fi
          echo "Directory listing (first 30 lines):"
          echo "$LISTING" | head -30

          GCC_MCF_FILE=$(echo "$LISTING" | \
            grep -oE 'mingw-w64-gcc-mcf_[0-9]+_[0-9.]+_x64-ucrt_[a-f0-9]+\.7z' | \
            sort -r | head -n 1)
          if [ -z "$GCC_MCF_FILE" ]; then
            echo "Error: could not find latest gcc-mcf x64-ucrt archive" >&2
            exit 1
          fi
          GCC_MCF_URL="https://gcc-mcf.lhmouse.com/$GCC_MCF_FILE"
          echo "Downloading: $GCC_MCF_URL"
          curl -fL --retry 3 "$GCC_MCF_URL" -o "$GCC_MCF_FILE"
          ls -lh "$GCC_MCF_FILE"

          echo "Extracting..."
          mkdir -p /c/gcc-mcf
          7z x "$GCC_MCF_FILE" -o/c/gcc-mcf -y

          echo "Extracted top-level structure:"
          find /c/gcc-mcf -maxdepth 2 -type d

          # Locate bin/ — use -exec dirname instead of -printf for compatibility
          GCC_MCF_BIN=$(find /c/gcc-mcf -name "${TARGET}-gcc.exe" -exec dirname {} \; | head -n 1)
          if [ -z "$GCC_MCF_BIN" ]; then
            echo "Error: could not find ${TARGET}-gcc.exe after extraction" >&2
            echo "All .exe files found:" >&2
            find /c/gcc-mcf -name "*.exe" | head -20 >&2
            exit 1
          fi
          GCC_MCF_BIN_WIN=$(cygpath -w "$GCC_MCF_BIN")
          echo "$GCC_MCF_BIN_WIN" >> "$GITHUB_PATH"
          echo "gcc-mcf installed at: $GCC_MCF_BIN"
          "$GCC_MCF_BIN/${TARGET}-gcc.exe" --version
          echo "--- bundled tools ---"
          "$GCC_MCF_BIN/cmake.exe" --version | head -1
          "$GCC_MCF_BIN/meson.exe" --version || "$GCC_MCF_BIN/meson" --version
          "$GCC_MCF_BIN/ninja.exe" --version
          "$GCC_MCF_BIN/pkg-config.exe" --version || "$GCC_MCF_BIN/pkgconf.exe" --version

      - name: Verify toolchain
        run: |
          set -eux
          command -v "${TARGET}-gcc"
          command -v "${TARGET}-g++"
          command -v "${TARGET}-windres"
          command -v "${TARGET}-ar"
          command -v "${TARGET}-nm"
          command -v "${TARGET}-ranlib"
          command -v "${TARGET}-strip"
          command -v "${TARGET}-dlltool"
          "${TARGET}-gcc" --version
          "${TARGET}-g++" --version
          "${TARGET}-windres" --version || true

      - name: Build libraries
        run: |
          ./ci/build-mingw64.sh

      - name: Build mpv
        id: build
        run: |
          ./ci/build-mingw64.sh meson pack

      - name: Print meson log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          cat ./mingw_build/meson-logs/meson-log.txt

      - name: Functional test
        run: |
          cd artifact
          ./mpv.com -v --no-config

      - name: Get artifact name
        id: artifact
        run: |
          VERSION_FILE=$(find . -path "*/common/version.h" -type f | head -n 1)
          VER=$(grep VERSION "$VERSION_FILE" | cut -d'"' -f2)
          echo "name=mpv-$VER-${{ github.run_id }}-$TARGET" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifact/*

      - name: Save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.TARGET }}-${{ steps.get_time.outputs.timestamp }}
