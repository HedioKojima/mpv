name: build

# 手动触发。本仓库只放 CI 文件，mpv 源码每次构建时从上游 master 拉取。
# 工具链用 Kosm8/llvm-mingw release（clang/lld，与 shinchiro/Kosm8 产物同源），
# 所有 mpv 依赖由 ci/build-mingw64-full.sh 自建（git master）。
on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

permissions: {}

jobs:
  mpv-win64:
    # llvm-mingw 解压到 workspace/llvm（bin 与 x86_64-w64-mingw32 sysroot 同根，
    # 依赖 prefix = llvm/x86_64-w64-mingw32，即 clang 的默认 sysroot）。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI overlay (this repo)
        uses: actions/checkout@v4
        with:
          path: ci-overlay

      # fetch-depth: 0 + fetch-tags 让 git describe 能算出 v0.x.y-n-gxxxx 完整版本号
      # （mpv 的版本号靠 git describe --tags --match v0.* 生成，浅克隆会退化成 dev 版本）
      - name: Checkout mpv source (upstream master)
        uses: actions/checkout@v4
        with:
          repository: mpv-player/mpv
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm
          pip install --user meson

      - name: Install llvm-mingw (Kosm8 latest)
        run: |
          mkdir llvm
          url=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Kosm8/llvm-mingw/releases/latest \
            | jq -r '.assets[] | select(.name | match("ucrt-ubuntu.*x86_64")) | .browser_download_url')
          echo "Downloading $url"
          curl -sLO "$url"
          f=$(basename "$url" .tar.xz)
          tar -xJf "$f.tar.xz" -C llvm --strip-components=1 \
            --exclude "aarch64*" --exclude "arm64ec*" --exclude "armv7*" --exclude "i686*"
          rm -f "$f.tar.xz"
          test -x llvm/bin/clang
          echo "$PWD/llvm/bin" >> "$GITHUB_PATH"

      - name: Build (all deps from git master)
        run: |
          # 兼容脚本放在仓库根或 ci/ 下任一位置
          script=$(find ci-overlay -name build-mingw64-full.sh -print -quit)
          test -n "$script" || { echo "build-mingw64-full.sh not found in this repo"; exit 1; }
          mkdir -p ci
          cp "$script" ci/build-mingw64-full.sh
          ./ci/build-mingw64-full.sh

      - name: Check DLL imports (static single-file assertion)
        run: |
          echo "mpv.exe imports:"
          x86_64-w64-mingw32-objdump -p artifact/mpv.exe | grep 'DLL Name'
          # 应只出现系统库（KERNEL32/USER32/... 与 api-ms-win-crt-* 前缀），
          # 出现 libc++/libunwind/libwinpthread/libmpv-2 之类即为静态链接失败。

      # GitHub runner 预装 wine；失败不阻塞构建，只作运行性冒烟提示
      - name: Smoke test (wine)
        run: |
          wine artifact/mpv.exe --no-config --version || \
            echo "::warning::wine smoke test failed (non-fatal)"

      - name: Upload mpv
        uses: actions/upload-artifact@v4
        with:
          name: mpv-win64-full-git
          path: artifact/
          if-no-files-found: error
