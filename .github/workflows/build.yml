name: build-mingw64

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw64:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    env:
      TARGET: x86_64-w64-mingw32

      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      DOWNLOAD_CACHE: ${{ github.workspace }}/.ccache/downloads

      # Git Bash:
      # create real native symlinks instead of copying.
      #
      # The build script uses:
      #   prefix_dir/usr -> .
      #   prefix_dir/local -> .
      #
      # so real symlink semantics are required.
      MSYS: winsymlinks:nativestrict

      # Fallback IP for gcc-mcf.lhmouse.com.
      #
      # GitHub-hosted runners may intermittently fail to resolve this host
      # through normal DNS, so curl can use --resolve as a fallback.
      MCF_PINNED_IP: 204.152.213.15

    steps:

      # ---------------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v7

      # ---------------------------------------------------------------------
      # ccache
      # ---------------------------------------------------------------------

      - name: Get cache timestamp
        id: get_time
        run: |
          echo "timestamp=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: mcf-${{ env.TARGET }}-${{ steps.get_time.outputs.timestamp }}
          restore-keys: |
            mcf-${{ env.TARGET }}-

      # ---------------------------------------------------------------------
      # Additional tools
      #
      # gcc-mcf ships most of the build tools:
      #
      #   cmake
      #   meson
      #   ninja
      #   pkgconf/pkg-config
      #   make/mingw32-make
      #   wget
      #   curl
      #   python
      #   yasm
      #
      # The GitHub runner still needs:
      #
      #   nasm
      #   ccache
      #   7-Zip
      # ---------------------------------------------------------------------

      - name: Install minimal extra tools
        run: |
          choco install --no-progress -y nasm ccache 7zip

          # Chocolatey does not refresh PATH in the current process.
          echo "C:\\Program Files\\7-Zip" >> "$GITHUB_PATH"
          echo "C:\\ProgramData\\chocolatey\\bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------------------
      # Install latest gcc-mcf
      # ---------------------------------------------------------------------

      - name: Install latest gcc-mcf toolchain
        run: |
          set -eux

          export PATH="/c/Program Files/7-Zip:$PATH"

          command -v 7z

          # -----------------------------------------------------------------
          # Get gcc-mcf directory listing.
          #
          # We deliberately do NOT pin a specific release.
          #
          # The newest x86_64 UCRT archive is selected automatically.
          # -----------------------------------------------------------------

          LISTING=""

          for attempt in 1 2 3; do

            if LISTING=$(
              curl -fsSL \
                --retry 2 \
                --retry-delay 5 \
                https://gcc-mcf.lhmouse.com/
            ); then
              break
            fi

            if LISTING=$(
              curl -fsSL \
                --retry 2 \
                --retry-delay 5 \
                --resolve "gcc-mcf.lhmouse.com:443:${MCF_PINNED_IP}" \
                https://gcc-mcf.lhmouse.com/
            ); then
              break
            fi

            echo "Attempt $attempt failed; retrying in 10 seconds..."
            sleep 10
          done

          if [ -z "$LISTING" ]; then
            echo "Error: could not fetch gcc-mcf directory listing" >&2
            exit 1
          fi

          echo "gcc-mcf directory listing:"
          echo "$LISTING" | head -40

          # -----------------------------------------------------------------
          # Find every x86_64-UCRT gcc-mcf archive.
          #
          # Expected:
          #
          #   mingw-w64-gcc-mcf_YYYYMMDD_GCCVERSION_x64-ucrt_HASH.7z
          #
          # Do NOT accept:
          #
          #   x86
          #   x64-msvcrt
          #   package manifests
          # -----------------------------------------------------------------

          GCC_MCF_FILES=$(
            printf '%s\n' "$LISTING" |
              grep -oE \
                'mingw-w64-gcc-mcf_[0-9]{8}_[0-9][0-9.]*_x64-ucrt_[a-f0-9]+\.7z' |
              sort -u
          )

          if [ -z "$GCC_MCF_FILES" ]; then
            echo "Error: no x86_64 UCRT gcc-mcf archive found" >&2
            exit 1
          fi

          echo "Available x86_64-UCRT gcc-mcf archives:"
          printf '%s\n' "$GCC_MCF_FILES"

          # -----------------------------------------------------------------
          # Sort by the YYYYMMDD component and select the newest build.
          # -----------------------------------------------------------------

          GCC_MCF_FILE=$(
            printf '%s\n' "$GCC_MCF_FILES" |
              sort -t_ -k2,2nr |
              head -n 1
          )

          if [ -z "$GCC_MCF_FILE" ]; then
            echo "Error: failed to select latest gcc-mcf archive" >&2
            exit 1
          fi

          echo "Selected gcc-mcf archive:"
          echo "$GCC_MCF_FILE"

          GCC_MCF_URL="https://gcc-mcf.lhmouse.com/$GCC_MCF_FILE"

          echo "Downloading:"
          echo "$GCC_MCF_URL"

          # -----------------------------------------------------------------
          # Download archive.
          #
          # Normal DNS first.
          # Fallback --resolve second.
          # -----------------------------------------------------------------

          if ! curl -fL \
            --retry 5 \
            --retry-delay 5 \
            "$GCC_MCF_URL" \
            -o "$GCC_MCF_FILE"
          then
            curl -fL \
              --retry 5 \
              --retry-delay 5 \
              --resolve "gcc-mcf.lhmouse.com:443:${MCF_PINNED_IP}" \
              "$GCC_MCF_URL" \
              -o "$GCC_MCF_FILE"
          fi

          test -s "$GCC_MCF_FILE"

          ls -lh "$GCC_MCF_FILE"

          # -----------------------------------------------------------------
          # Extract
          # -----------------------------------------------------------------

          rm -rf /c/gcc-mcf
          mkdir -p /c/gcc-mcf

          echo "Extracting gcc-mcf..."

          7z x \
            "$GCC_MCF_FILE" \
            -o/c/gcc-mcf \
            -y

          # -----------------------------------------------------------------
          # Find compiler/bin directory.
          # -----------------------------------------------------------------

          GCC_MCF_BIN=$(
            find /c/gcc-mcf \
              -type f \
              -name "${TARGET}-gcc.exe" \
              -exec dirname {} \; |
            head -n 1
          )

          if [ -z "$GCC_MCF_BIN" ]; then
            echo "Error: could not find ${TARGET}-gcc.exe" >&2
            echo "Available GCC executables:" >&2
            find /c/gcc-mcf \
              -type f \
              -name "*-gcc.exe" |
            head -50 >&2
            exit 1
          fi

          GCC_MCF_BIN_WIN=$(cygpath -w "$GCC_MCF_BIN")

          echo "$GCC_MCF_BIN_WIN" >> "$GITHUB_PATH"

          echo "gcc-mcf compiler/bin directory:"
          echo "$GCC_MCF_BIN"

          # -----------------------------------------------------------------
          # gcc-mcf puts all target-prefixed binutils in this same directory:
          #
          #   ${TARGET}-ar.exe
          #   ${TARGET}-nm.exe
          #   ${TARGET}-ranlib.exe
          #   ${TARGET}-strip.exe
          #   ${TARGET}-windres.exe
          #   ${TARGET}-dlltool.exe
          #
          # There is NO separate:
          #
          #   ${TARGET}/bin
          #
          # directory in this gcc-mcf package layout.
          # -----------------------------------------------------------------

          test -f "$GCC_MCF_BIN/${TARGET}-gcc.exe"
          test -f "$GCC_MCF_BIN/${TARGET}-g++.exe"
          test -f "$GCC_MCF_BIN/${TARGET}-ar.exe"
          test -f "$GCC_MCF_BIN/${TARGET}-nm.exe"
          test -f "$GCC_MCF_BIN/${TARGET}-ranlib.exe"
          test -f "$GCC_MCF_BIN/${TARGET}-strip.exe"
          test -f "$GCC_MCF_BIN/${TARGET}-windres.exe"
          test -f "$GCC_MCF_BIN/${TARGET}-dlltool.exe"

          # -----------------------------------------------------------------
          # gcc-mcf provides mingw32-make.exe.
          #
          # Some Autotools/LuaJIT build logic invokes plain "make".
          # Provide make.exe as an alias.
          # -----------------------------------------------------------------

          if [ -f "$GCC_MCF_BIN/mingw32-make.exe" ]; then
            cp -v \
              "$GCC_MCF_BIN/mingw32-make.exe" \
              "$GCC_MCF_BIN/make.exe"
          else
            echo "Error: mingw32-make.exe not found" >&2
            exit 1
          fi

          echo
          echo "================ gcc-mcf ================"

          "$GCC_MCF_BIN/${TARGET}-gcc.exe" --version

          echo
          echo "================ gcc configuration ================"

          "$GCC_MCF_BIN/${TARGET}-gcc.exe" -v 2>&1

          echo
          echo "================ bundled tools ================"

          if [ -f "$GCC_MCF_BIN/cmake.exe" ]; then
            "$GCC_MCF_BIN/cmake.exe" --version | head -1
          fi

          if [ -f "$GCC_MCF_BIN/meson.exe" ]; then
            "$GCC_MCF_BIN/meson.exe" --version
          elif [ -f "$GCC_MCF_BIN/meson" ]; then
            "$GCC_MCF_BIN/meson" --version
          fi

          if [ -f "$GCC_MCF_BIN/ninja.exe" ]; then
            "$GCC_MCF_BIN/ninja.exe" --version
          fi

          if [ -f "$GCC_MCF_BIN/pkg-config.exe" ]; then
            "$GCC_MCF_BIN/pkg-config.exe" --version
          elif [ -f "$GCC_MCF_BIN/pkgconf.exe" ]; then
            "$GCC_MCF_BIN/pkgconf.exe" --version
          fi

      # ---------------------------------------------------------------------
      # Verify toolchain
      # ---------------------------------------------------------------------

      - name: Verify gcc-mcf toolchain
        run: |
          set -eux

          GCC_BIN="$(dirname "$(command -v "${TARGET}-gcc")")"

          # gcc-mcf puts gcc/g++, windres, ar, nm, ranlib, strip and
          # dlltool in the same ucrt64/bin directory.
          export PATH="$GCC_BIN:$PATH"

          echo "Compiler:"
          command -v "${TARGET}-gcc"

          echo "C++ compiler:"
          command -v "${TARGET}-g++"

          echo "Assembler driver:"
          command -v "${TARGET}-gcc"

          echo "GCC assembler:"
          AS_PATH=$("${TARGET}-gcc" -print-prog-name=as)
          echo "$AS_PATH"
          test -f "$AS_PATH"

          echo "windres:"
          command -v "${TARGET}-windres"

          echo "ar:"
          command -v "${TARGET}-ar"

          echo "nm:"
          command -v "${TARGET}-nm"

          echo "ranlib:"
          command -v "${TARGET}-ranlib"

          echo "strip:"
          command -v "${TARGET}-strip"

          echo "dlltool:"
          command -v "${TARGET}-dlltool"

          echo "make:"
          command -v make

          echo
          echo "================ gcc version ================"

          "${TARGET}-gcc" --version
          "${TARGET}-g++" --version

          echo
          echo "================ thread model ================"

          GCC_CONFIG=$("${TARGET}-gcc" -v 2>&1)

          echo "$GCC_CONFIG"

          if ! printf '%s\n' "$GCC_CONFIG" |
              grep -qiE 'Thread model:.*mcf'
          then
            echo "Error: gcc is not using the MCF thread model" >&2
            exit 1
          fi

          echo "MCF thread model detected."

          echo
          echo "================ runtime DLLs ================"

          RUNTIME_DIR="$(dirname "$(command -v "${TARGET}-gcc")")"

          test -f "$RUNTIME_DIR/libgcc_s_seh-1.dll"
          test -f "$RUNTIME_DIR/libstdc++-6.dll"
          test -f "$RUNTIME_DIR/libmcfgthread-2.dll"

          ls -lh \
            "$RUNTIME_DIR/libgcc_s_seh-1.dll" \
            "$RUNTIME_DIR/libstdc++-6.dll" \
            "$RUNTIME_DIR/libmcfgthread-2.dll"

          echo
          echo "================ GCC internal tools ================"

          LD_PATH=$("${TARGET}-gcc" -print-prog-name=ld)
          CC1_PATH=$("${TARGET}-gcc" -print-prog-name=cc1)

          echo "LD  = $LD_PATH"
          echo "CC1 = $CC1_PATH"

          test -f "$LD_PATH"
          test -f "$CC1_PATH"

          echo
          echo "================ smoke test ================"

          cat > /tmp/mcf_test.c <<'EOF'
          #include <stdio.h>

          int main(void)
          {
              puts("gcc-mcf smoke test passed");
              return 0;
          }
          EOF

          "${TARGET}-gcc" \
            /tmp/mcf_test.c \
            -o /tmp/mcf_test.exe

          /tmp/mcf_test.exe

      # ---------------------------------------------------------------------
      # Build dependencies
      # ---------------------------------------------------------------------

      - name: Build libraries
        run: |
          ./ci/build-mingw64.sh

      # ---------------------------------------------------------------------
      # Build mpv
      # ---------------------------------------------------------------------

      - name: Build mpv
        id: build
        run: |
          ./ci/build-mingw64.sh meson pack

      # ---------------------------------------------------------------------
      # Meson diagnostics
      # ---------------------------------------------------------------------

      - name: Print meson log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          if [ -f ./mingw_build/meson-logs/meson-log.txt ]; then
            cat ./mingw_build/meson-logs/meson-log.txt
          else
            echo "meson-log.txt not found"
          fi

      # ---------------------------------------------------------------------
      # Functional test
      # ---------------------------------------------------------------------

      - name: Functional test
        run: |
          cd artifact

          ./mpv.com \
            -v \
            --no-config

      # ---------------------------------------------------------------------
      # Artifact name
      # ---------------------------------------------------------------------

      - name: Get artifact name
        id: artifact
        run: |
          VERSION_FILE=$(find . \
            -path "*/common/version.h" \
            -type f |
            head -n 1)

          VER=$(grep VERSION "$VERSION_FILE" | cut -d'"' -f2)

          echo "name=mpv-$VER-${{ github.run_id }}-$TARGET" \
            >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Upload artifact
      # ---------------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifact/*

      # ---------------------------------------------------------------------
      # Save ccache
      # ---------------------------------------------------------------------

      - name: Save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: mcf-${{ env.TARGET }}-${{ steps.get_time.outputs.timestamp }}
