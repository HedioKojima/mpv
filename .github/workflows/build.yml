name: build-mingw64

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw64:
    runs-on: ubuntu-24.04

    env:
      TARGET: x86_64-w64-mingw32
      LLVM_MINGW_VERSION: 20260616
      LLVM_MINGW_CRT: ucrt

      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      DOWNLOAD_CACHE: ${{ github.workspace }}/.ccache/downloads

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get cache timestamp
        id: get_time
        run: |
          echo "timestamp=$(date +%s%N)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.TARGET }}-${{ steps.get_time.outputs.timestamp }}
          restore-keys: |
            ${{ env.TARGET }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install --no-install-recommends -y \
            ccache \
            curl \
            git \
            python3-pip \
            nasm \
            ninja-build \
            pkgconf \
            wine64 \
            wine

          python -m pip install meson

      - name: Install llvm-mingw
        run: |
          LLVM_MINGW_DISTRO="ubuntu-24.04-x86_64"
          LLVM_MINGW_ARCHIVE="llvm-mingw-${LLVM_MINGW_VERSION}-${LLVM_MINGW_CRT}-${LLVM_MINGW_DISTRO}.tar.xz"
          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_ARCHIVE}"

          echo "Downloading:"
          echo "$LLVM_MINGW_URL"

          curl -fL --retry 3 \
            "$LLVM_MINGW_URL" \
            -o "$LLVM_MINGW_ARCHIVE"

          sudo mkdir -p /opt/llvm-mingw

          sudo tar -xJf "$LLVM_MINGW_ARCHIVE" \
            --strip-components=1 \
            -C /opt/llvm-mingw

          echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

          echo "llvm-mingw:"
          /opt/llvm-mingw/bin/${TARGET}-clang --version

          echo "Toolchain:"
          ls -l /opt/llvm-mingw/bin/${TARGET}-clang
          ls -l /opt/llvm-mingw/bin/${TARGET}-clang++
          ls -l /opt/llvm-mingw/bin/${TARGET}-windres
          ls -l /opt/llvm-mingw/bin/${TARGET}-ar
          ls -l /opt/llvm-mingw/bin/${TARGET}-strip

      - name: Verify toolchain
        run: |
          set -eux

          command -v "${TARGET}-clang"
          command -v "${TARGET}-clang++"
          command -v "${TARGET}-windres"
          command -v "${TARGET}-ar"
          command -v "${TARGET}-nm"
          command -v "${TARGET}-ranlib"
          command -v "${TARGET}-strip"
          command -v "${TARGET}-dlltool"

          "${TARGET}-clang" --version
          "${TARGET}-clang++" --version
          "${TARGET}-windres" --version || true

      - name: Build libraries
        run: |
          ./ci/build-mingw64.sh

      - name: Build mpv
        id: build
        run: |
          ./ci/build-mingw64.sh meson pack

      - name: Print meson log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          cat ./mingw_build/meson-logs/meson-log.txt

      - name: Functional test
        run: |
          cd artifact
          wine ./mpv.com -v --no-config
        env:
          WINEDEBUG: '+loaddll'

      - name: Get artifact name
        id: artifact
        run: |
          VERSION_FILE=$(find . -path "*/common/version.h" -type f | head -n 1)
          VER=$(grep VERSION "$VERSION_FILE" | cut -d'"' -f2)

          echo "name=mpv-$VER-${{ github.run_id }}-$TARGET" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifact/*

      - name: Save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.TARGET }}-${{ steps.get_time.outputs.timestamp }}
